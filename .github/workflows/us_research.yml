# TikTok 选品数据分析 - 欧美区域 (US/EU)
#
# 目标市场: 美国(us) / 英国(uk) / 日本(jp) / 德国(de) / 法国(fr)
# 执行时间: 每天 08:00 / 16:00 UTC+8 (北京时间)
# 配置文件: config.us.yaml
#
# GitHub Secrets 需配置:
#   OPENAI_API_KEY
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID

name: 🇺🇸 US 选品分析

on:
  schedule:
    # 北京时间 08:00 = UTC 00:00
    - cron: "0 0 * * *"
    # 北京时间 16:00 = UTC 08:00
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      markets:
        description: "市场 (逗号分隔)"
        required: false
        default: "us,uk,jp"
      days:
        description: "数据回溯天数"
        required: false
        default: "7"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行 US 选品分析
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scheduler.py --region us --once \
            --markets "${{ github.event.inputs.markets || 'us,uk,jp' }}" \
            --days "${{ github.event.inputs.days || 7 }}"
