# TikTok 选品数据分析 - 东南亚区域 (SEA)
#
# 目标市场: 泰国(th) / 越南(vn) / 马来西亚(my) / 印尼(id) / 菲律宾(ph)
# 执行时间: 每天 07:00 / 11:00 / 19:00 UTC+7 (泰国时间)
# 配置文件: config.sea.yaml
#
# GitHub Secrets 需配置:
#   OPENAI_API_KEY
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
#   SMTP_USER / SMTP_PASSWORD (QQ邮箱，替代Telegram国内使用)
#   (可选) ECHO_TIK_COOKIE

name: 🌏 SEA 选品分析

on:
  schedule:
    # 泰国 08:00 = UTC 01:00
    - cron: "0 1 * * *"
    # 泰国 12:00 = UTC 05:00
    - cron: "0 5 * * *"
    # 泰国 20:00 = UTC 13:00
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      markets:
        description: "市场 (逗号分隔)"
        required: false
        default: "th,vn,my"
      days:
        description: "数据回溯天数"
        required: false
        default: "7"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行 SEA 选品分析
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # QQ 邮箱 SMTP（推荐用于国内环境通知）
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python scheduler.py --region sea --once \
            --markets "${{ github.event.inputs.markets || 'th,vn,my' }}" \
            --days "${{ github.event.inputs.days || 7 }}"
