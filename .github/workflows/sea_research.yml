# TikTok Thailand product research - free GitHub Actions runner.
# Runs at 09:00 Asia/Shanghai / 08:00 Asia/Bangkok every day.

name: 🌏 SEA 选品分析

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      markets:
        description: "市场（默认仅泰国）"
        required: false
        default: "th"
      days:
        description: "数据回溯天数"
        required: false
        default: "7"

permissions:
  contents: read

concurrency:
  group: sea-product-research
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行自动测试
        run: python -m unittest discover -s tests -v

      - name: 检查邮件通知配置
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          test -n "$SMTP_USER" || { echo "Missing secret: SMTP_USER"; exit 1; }
          test -n "$SMTP_PASSWORD" || { echo "Missing secret: SMTP_PASSWORD"; exit 1; }
          test -n "$NOTIFY_EMAIL" || { echo "Missing secret: NOTIFY_EMAIL"; exit 1; }

      - name: 运行泰国选品分析
        env:
          FASTMOSS_MCP_KEY: ${{ secrets.FASTMOSS_MCP_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python scheduler.py --region sea --once \
            --markets "${{ github.event.inputs.markets || 'th' }}" \
            --days "${{ github.event.inputs.days || 7 }}"

      - name: 保存选品报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thailand-selection-${{ github.run_number }}
          path: |
            reports/latest_selection.md
            logs/*.log
          if-no-files-found: warn
          retention-days: 14
